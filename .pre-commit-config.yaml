repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
      - id: go-mod-tidy
      - id: go-vet-mod

  - repo: local
    hooks:
      - id: token-budget
        name: token budget (CLAUDE.md files, AGENTS.md, orchestrator, session listing)
        entry: make token-audit
        language: system
        files: (^|/)(CLAUDE|AGENTS)\.md$|^\.claude/(agents|commands)/.*\.md$|^\.claude/skills/.*/SKILL\.md$
        pass_filenames: false
