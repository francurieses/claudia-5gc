version: "2"
run:
  tests: true
  timeout: 5m
# unparam is intentionally not enabled: its remaining findings are uniform
# dispatch/handler signatures (ctx, gnb, ...) and interface-shaped results that
# are kept on purpose (CLAUDE.md: ctx first on blocking functions).
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gosec:
      excludes:
        - G104  # unchecked errors: handled case by case
        # G115 (integer overflow conversion) fires on every bounded wire-format
        # narrowing in the NAS/NGAP/PFCP codecs (length octets, masked fields) and
        # cannot see the bound. Codec lengths are validated by the encoders and
        # fuzz targets (shared/nas/fuzz_test.go), so it is a pure false positive here.
        - G115
        # G602 (slice index out of range) mis-reads explicit len() guards in the
        # TLV decoders (gosec taint analysis false positive).
        - G602
        # G703/G704/G705 (taint analysis: path traversal, SSRF, XSS) flag config-
        # and NRF-derived values: YAML paths and SBI base URLs are operator/mTLS
        # trusted inputs, never request data; the SBI is always mTLS (CLAUDE.md).
        - G703
        - G704
        - G705
        # G118 (goroutine uses context.Background): detached goroutines are
        # deliberate (nf/amf/CLAUDE.md §9: work outliving a handler must not use r.Context()).
        - G118
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # shared/crypto primitives are a hard stop for the platform agents (AGENTS.md):
      # formatting/style findings there are listed in the REL19 report and fixed
      # only with human sign-off. Remove this rule when that happens.
      - linters: [goimports, unconvert, staticcheck, gosec]
        path: shared/crypto/
      # Test code: httptest recorders/servers trip bodyclose, and
      # fixture I/O trips gosec taint rules.
      - linters:
          - errcheck
          - gosec
          - bodyclose
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
