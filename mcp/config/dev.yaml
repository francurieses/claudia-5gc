# MCP server — development configuration.
# Schema: mcp/internal/config/config.go. Mounted at /etc/5gc/config.yaml.

# Which transports to run: stdio | sse | both. Both serve an identical tool registry.
transport: both

sse:
  listen_addr: "0.0.0.0:9300"
  # dev-only debug endpoint /mcp/sessions listing live SSE clients.
  debug: true
  # Empty cert/key ⇒ plain HTTP (dev). Set both for TLS; add ca_file for mTLS.
  tls:
    cert_file: ""
    key_file: ""
    ca_file: ""

auth:
  # Empty ⇒ authentication disabled (dev). Set to require "Authorization: Bearer <token>".
  bearer_token: ""

# Upstream services consumed by Group B/C/D tools.
nrf_addr: "https://nrf:8000"
amf_addr: "http://amf:9002"
jaeger_addr: "http://jaeger:16686"
prometheus_addr: "http://prometheus:9090"

# mgmt-portal's plain-HTTP API. The status, control, runtime-config and PCAP
# tools go through it; the portal holds the Docker socket (read-only, internal
# network only), so MCP never touches Docker directly.
portal_addr: "http://mgmt-portal:8080"

# Group I: PDU session QoS tools — SMF management API (shares the SBI listener,
# mTLS) and UDM SDM (mTLS).
smf_addr: "https://smf:8004"
udm_addr: "https://udm:8003"

# pcf_binding_list: BSF Nbsf_Management SBI (mTLS). Env: BSF_ADDR.
bsf_addr: "https://bsf:8010"

# af_qos_session_*: NEF Nnef_AFsessionWithQoS SBI (mTLS + NRF bearer token). Env: NEF_ADDR.
nef_addr: "https://nef:8011"

# sms_send_mt: SMSF internal MT-SMS trigger (mTLS). Env: SMSF_ADDR.
smsf_addr: "https://smsf:8009"

# TLS material for the NRF SBI (which enforces mTLS). The AMF management API and
# Jaeger/Prometheus are plain HTTP and need none of this.
ca_file: "/etc/5gc/pki/ca.crt"
client_cert_file: "/etc/5gc/pki/mcp.crt"
client_key_file: "/etc/5gc/pki/mcp.key"

# Host override for NF metrics addresses read from Prometheus (smf:9105 -> <host>:9105).
# Empty inside Docker (container names resolve). Set to "localhost" only when MCP runs on
# the host; see config/local.yaml.example. Env: MCP_METRICS_HOST_OVERRIDE.
metrics_host_override: ""

# Group G: Prometheus metrics tools (supplements prometheus_addr above).
prometheus:
  addr: ""                       # empty = use top-level prometheus_addr
  query_timeout_sec: 5

# Guardrails (see mcp/internal/guard). access_mode caps what is exposed:
# read-only | operator | lab. dev runs operator so mutating and disruptive
# tools are available with confirm:true; admin tools need lab.
access_mode: operator
allow_service_control: false
guardrails:
  min_interval_ms: 2000      # minimum gap between two confirmed disruptive calls
  max_result_bytes: 262144   # 256 KiB cap on any single tool result
  audit_size: 256

# Loki query API used by log_query and procedure_timeline (obs-net).
loki_addr: "http://loki:3100"
