global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 5gc-nfs
    static_configs:
      - targets: [nrf:9100]
        labels: {nf: NRF}
      - targets: [amf:9101]
        labels: {nf: AMF}
      - targets: [ausf:9102]
        labels: {nf: AUSF}
      - targets: [udm:9103]
        labels: {nf: UDM}
      - targets: [udr:9104]
        labels: {nf: UDR}
      - targets: [smf:9105]
        labels: {nf: SMF}
      - targets: [pcf:9106]
        labels: {nf: PCF}
      - targets: [upf:9107]
        labels: {nf: UPF}
      - targets: [nssf:9109]
        labels: {nf: NSSF}
      - targets: [smsf:9110]
        labels: {nf: SMSF}
      - targets: [bsf:9111]
        labels: {nf: BSF}
      - targets: [nef:9112]
        labels: {nf: NEF}
      - targets: [lmf:9113]
        labels: {nf: LMF}
      - targets: [sepp:9115]
        labels: {nf: SEPP, role: sepp}
      # hsepp runs in the roaming profile only; a down target is expected without it.
      - targets: [hsepp:9115]
        labels: {nf: SEPP, role: hsepp}
      # hnrf (home PLMN 001/02) also runs in the roaming profile only; `role` keeps it apart from nrf.
      - targets: [hnrf:9100]
        labels: {nf: NRF, role: hnrf}
      # Home PLMN NFs of the roaming profile; targets are down until those services exist.
      - targets: [hausf:9102]
        labels: {nf: AUSF, role: home}
      - targets: [hudm:9103]
        labels: {nf: UDM, role: home}
      - targets: [hudr:9104]
        labels: {nf: UDR, role: home}
