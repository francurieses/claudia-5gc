version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories:
      - /nf/*
      - /mcp
      - /tools/ueransim
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /tools/mgmt-portal/web
    schedule:
      interval: monthly
