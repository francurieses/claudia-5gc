# Roaming test peer SEPP (PLMN 001/02, compose profile `roaming`). Same image as the local core
# `sepp`, different config. It keeps an inline partner for the local core (PLMN 001/01).
nf_instance_id: "00000000-0000-4014-8000-000000000002"

plmn:
  mcc: "001"
  mnc: "02"

sbi:
  address: "0.0.0.0:8014"
  fqdn: "sepp.5gc.mnc002.mcc001.3gppnetwork.org"
  tls:
    cert_file: /etc/5gc/pki/sepp.crt
    key_file: /etc/5gc/pki/sepp.key
    ca_file: /etc/5gc/pki/ca.crt

# N32 listener (N32-c handshake + N32-f forwarding between SEPPs). Used from REL19-9.4/9.5.
n32:
  address: "0.0.0.0:8443"
  # Own N32 certificate of the test peer (SAN sepp.5gc.mnc002.mcc001.3gppnetwork.org).
  tls:
    cert_file: /etc/5gc/pki/n32/testpeer/sepp.crt
    key_file: /etc/5gc/pki/n32/testpeer/sepp.key
  # Partner = the local core (PLMN 001/01); trust anchor = the local N32 CA only (never the SBI CA).
  # `address` makes this test peer run the N32-c initiator towards the local core at startup.
  partners:
    - plmn: {mcc: "001", mnc: "01"}
      n32:
        ca_file: /etc/5gc/pki/n32/local/ca.crt
        address: "sepp.5gc.mnc001.mcc001.3gppnetwork.org:8443"

peers:
  nrf: "hnrf:8000"

metrics:
  address: "0.0.0.0:9115"

