nf_instance_id: "00000000-0000-4014-8000-000000000001"

plmn:
  mcc: "001"
  mnc: "01"

sbi:
  address: "0.0.0.0:8014"
  fqdn: "sepp.5gc.mnc001.mcc001.3gppnetwork.org"
  tls:
    cert_file: /etc/5gc/pki/sepp.crt
    key_file: /etc/5gc/pki/sepp.key
    ca_file: /etc/5gc/pki/ca.crt

# N32 listener (N32-c handshake + N32-f forwarding between SEPPs), TS 29.573 / TS 33.501 §13.1.
# The default core has NO roaming partner: the listener starts if the local N32 certificate
# exists and rejects every handshake until a partner is added.
# Add a partner (inline `partners:` below, or the shared partners file
# /etc/5gc/roaming/partners.yaml / env ROAMING_PARTNERS_FILE; the file wins per PLMN), then restart:
#   see config/roaming/partners.example.yaml and docs/n32-interop-profile.md
# The SBI CA is never an N32 trust anchor: each partner PLMN has its own ca_file.
n32:
  address: "0.0.0.0:8443"
  # partners_file: /etc/5gc/roaming/partners.yaml   # default; ROAMING_PARTNERS_FILE overrides
  # partners: []
  # Local N32 certificate (SAN must name sbi.fqdn); no fallback to sbi.tls.
  tls:
    cert_file: /etc/5gc/pki/n32/local/sepp.crt
    key_file: /etc/5gc/pki/n32/local/sepp.key

peers:
  nrf: "nrf:8000"

metrics:
  address: "0.0.0.0:9115"

