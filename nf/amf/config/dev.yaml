amf_id: 1
amf_region_id: 1
amf_set_id: 1
# Registration area (TAI list) sent to UEs in Registration Accept (IEI 0x54).
# Must cover every TAC the connected gNBs broadcast (config/ueransim/gnb.yaml tac: 1).
# The UE's current TAC is always included even if missing here.
served_tacs:
    - 1
features:
    # Disabled 2026-09-03 (lab-11 OTA debug): the PCF-side MANAGE UE POLICY
    # COMMAND encoder has two off-by-N length-field bugs (nf/pcf/internal/policy/ursp.go
    # lines 109 and 115 — see labs/lab-11-nr-sa-n78-ocudu/evidence/ota-attach-debug-2026-09-03.md)
    # that produce a malformed UE policy container. A real UE (Pixel 6a) may choke on
    # it. Disabling URSP delivery removes the post-Registration-Complete DL NAS
    # Transport push entirely so PDU session establishment can be tested without it.
    # Re-enable once nf/pcf/internal/policy/ursp.go is fixed and re-verified.
    ursp_enabled: false
metrics:
    address: 0.0.0.0:9101
nf_instance_id: 00000000-0000-4001-8000-000000000001
ngap:
    address: 0.0.0.0:38412
    # Optional per-gNB release cap (REL19-4.8). The release is inferred from the
    # NG Setup Request (default Rel-17); max_release only lowers it. One selector
    # per entry; a global_ran_node_id match beats a gnb_name match.
    # ran_profiles:
    #   - global_ran_node_id: "000001/24"   # GlobalRANNode.IDString()
    #     max_release: Rel-17
    #   - gnb_name: "lab-gnb-*"             # path.Match glob
    #     max_release: Rel-18
peers:
    ausf: ausf:8002
    nrf: nrf:8000
    nssf: nssf:8007
    pcf: pcf:8006
    smf: smf:8004
    smsf: smsf:8009
    udm: udm:8003
sbi:
    address: 0.0.0.0:8001
    ca_file: /etc/5gc/pki/ca.crt
    cert_file: /etc/5gc/pki/amf.crt
    key_file: /etc/5gc/pki/amf.key
security:
    null_ciphering: true
snssais:
    - sd: "000001"
      sst: 1
    - sd: "000002"
      sst: 1
    - sd: "000001"
      sst: 2
    - sd: "000001"
      sst: 3
    - sd: "001234"
      sst: 1
# Uplink NAS integrity enforcement (TS 24.501 §4.4.4.3): strict (default) | relaxed
# (debug only - integrity failures are logged and processed). Env: AMF_NAS_INTEGRITY_ENFORCEMENT.
nas_security:
  integrity_enforcement: strict
timers:
    implicit_detach_secs: 60
    mobile_reachable_guard_secs: 120
    pending_removal_watchdog_secs: 30
    t3512_secs: 60
    # NAS common-procedure timers, TS 24.501 §10.2 Table 10.2.2 default 6 s (range 1..60)
    t3550_secs: 6
    t3560_secs: 6
    t3570_secs: 6
operator:
    default_rfsp: 1
    # 5GS network feature support IE (0x21) optional bits (REL19-5.5). All off by default
    # (Registration Accept stays byte-identical). A bit is advertised only if set here AND
    # the UE set the matching 5GMM capability bit. un_per/lcs_upp/supl/rslp/mlcsup/ef5l
    # (post-Rel-17) additionally need, at top level:
    #   release: { profile: rel19, features: { NAS-NFS-EXT: true } }
    # network_feature_support:
    #   ncr: true
    #   rpr: true
    #   pr: true
    #   rslp: true
