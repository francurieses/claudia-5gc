# NRF — Development configuration
# Schema: nf/nrf/internal/config/config.go

# UUID estable para esta instancia de NRF (TS 29.510 §6.1.6.2.2)
nf_instance_id: "00000000-0000-4000-8000-000000000002"

# hNRF (home PLMN 001/02, profile: roaming): the per-NF plmn overrides config/operator.yaml.
plmn:
  mcc: "001"
  mnc: "02"

sbi:
  address: "0.0.0.0:8000"
  tls:
    cert_file: "/etc/5gc/pki/nrf.crt"
    key_file: "/etc/5gc/pki/nrf.key"
    ca_file: "/etc/5gc/pki/ca.crt"

# Heartbeat default per TS 29.510 (recommended 90s)
heartbeat_timeout_sec: 90

metrics:
  address: "0.0.0.0:9100"

# Release profile (default rel17 = frozen baseline). rel19 enables spec-literal
# SBI supportedFeatures negotiation (TS 29.500 §6.6.2). NF_RELEASE_PROFILE overrides.
# release:
#   profile: rel19
