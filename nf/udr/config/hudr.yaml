# UDR — Home PLMN 001/02 instance (hudr) for roaming registration (ROAM-001); same image as udr.
# Seed comes from compose env: UE_COUNT=0, SEED_EXTRA_SUPIS=imsi-001020000000001.

nf_instance_id: "00000000-0000-4008-8000-000000000002"

plmn:
  mcc: "001"
  mnc: "02"

sbi:
  address: "0.0.0.0:8005"
  fqdn: "udr.5gc.mnc002.mcc001.3gppnetwork.org"
  tls:
    cert_file: "/etc/5gc/pki/udr.crt"
    key_file:  "/etc/5gc/pki/udr.key"
    ca_file:   "/etc/5gc/pki/ca.crt"

metrics:
  address: "0.0.0.0:9104"

peers:
  nrf: "hnrf:8000"

# Release profile (default rel19; rel17 = frozen legacy baseline). rel19 enables spec-literal
# SBI supportedFeatures negotiation (TS 29.500 §6.6.2). NF_RELEASE_PROFILE overrides.
# release:
#   profile: rel17
