# H-AUSF (home PLMN 001/02) — roaming home-core configuration (RoamingRegistration)

nf_instance_id: "00000000-0000-4002-8000-000000000001"

plmn:
  mcc: "001"
  mnc: "02"

sbi:
  address: "0.0.0.0:8002"
  # FQDN advertised in the NF profile so the hSEPP can dial https://<fqdn>:8002 (TS 23.003 §28.5.2).
  fqdn: "ausf.5gc.mnc002.mcc001.3gppnetwork.org"
  tls:
    cert_file: "/etc/5gc/pki/ausf.crt"
    key_file:  "/etc/5gc/pki/ausf.key"
    ca_file:   "/etc/5gc/pki/ca.crt"

peers:
  nrf: "hnrf:8000"
  udm: "hudm:8003"

roaming:
  # Serving networks (besides own) authorized to authenticate UEs (TS 33.501 §6.1.2).
  authorized_serving_networks:
    - "5G:mnc001.mcc001.3gppnetwork.org"

metrics:
  address: "0.0.0.0:9102"
